<div class="forgot-password-container">

  <nb-card class="forgot-password-card">

    <nb-card-header>
      <div class="header-content">

        <div class="icon-container">
          <nb-icon icon="lock-outline"></nb-icon>
        </div>

        <div>
          <h2>Mot de passe oublié ?</h2>
          <p>
            Entrez votre adresse e-mail pour recevoir
            un lien de réinitialisation.
          </p>
        </div>

      </div>
    </nb-card-header>

    <nb-card-body>

      <div
        *ngIf="succes"
        class="success-message"
      >
        <nb-icon icon="checkmark-circle-2-outline"></nb-icon>

        <div>
          <strong>Demande envoyée</strong>

          <p>
            Si cette adresse e-mail correspond à un compte,
            un lien de réinitialisation vous sera envoyé.
          </p>
        </div>
      </div>

      <div
        *ngIf="erreur"
        class="error-message"
      >
        <nb-icon icon="alert-circle-outline"></nb-icon>

        <span>{{ erreur }}</span>
      </div>

      <form
        [formGroup]="formulaire"
        (ngSubmit)="envoyerDemande()"
        *ngIf="!succes"
      >

        <div class="form-group">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            nbInput
            fullWidth
            id="email"
            type="email"
            placeholder="exemple@meci.tg"
            formControlName="email"
          >

          <div
            class="field-error"
            *ngIf="
              formulaire.get('email')?.touched &&
              formulaire.get('email')?.invalid
            "
          >
            <span
              *ngIf="formulaire.get('email')?.errors?.['required']"
            >
              L'adresse e-mail est obligatoire.
            </span>

            <span
              *ngIf="formulaire.get('email')?.errors?.['email']"
            >
              Veuillez saisir une adresse e-mail valide.
            </span>
          </div>

        </div>

        <button
          nbButton
          status="primary"
          fullWidth
          type="submit"
          [disabled]="chargement"
        >

          <nb-icon
            *ngIf="!chargement"
            icon="paper-plane-outline"
          ></nb-icon>

          <nb-spinner
            *ngIf="chargement"
            size="small"
          ></nb-spinner>

          <span *ngIf="!chargement">
            Envoyer le lien
          </span>

          <span *ngIf="chargement">
            Envoi en cours...
          </span>

        </button>

      </form>

      <button
        nbButton
        ghost
        fullWidth
        class="back-button"
        type="button"
        (click)="retournerConnexion()"
      >

        <nb-icon icon="arrow-back-outline"></nb-icon>

        Retour à la connexion

      </button>

    </nb-card-body>

  </nb-card>

</div>
